packages:
  - "packages/*"
  - "apps/*"
  - "tests/*"
  - "plugins/*"
  # Bundled and example plugins are workspace members so their declared
  # dependencies are installed into each plugin's own node_modules — plugins
  # bring their own dependencies.
  - "examples/plugins/*"

# `pnpm run` performs a dependency-status check before every script, and pnpm 11
# defaults that check to `install`. The root `prepare` script runs `pnpm run`
# inside an install, so the default re-enters `prepare` through
# `@bb/server#generate:bb-official-marketplace` and the nested install fails while
# node_modules is still being built (`.bin/turbo` does not exist yet). The check
# is redundant here: CI installs explicitly with `--frozen-lockfile` first.
verifyDepsBeforeRun: false

# Settings that pnpm 10+/11 no longer read from the `pnpm` field in package.json.
# The lockfile records overrides and patchedDependencies, so an empty field is a
# lockfile-config mismatch rather than a no-op. See https://pnpm.io/settings.
supportedArchitectures:
  os:
    - current
  cpu:
    - arm64
    - x64

overrides:
  zod: 4.3.6
  "@expo/metro-config>lightningcss": 1.30.1

patchedDependencies:
  expo-modules-jsi@57.0.4: patches/expo-modules-jsi@57.0.4.patch
  oniguruma-to-es@4.3.4: patches/oniguruma-to-es@4.3.4.patch
  "@pierre/diffs@1.2.9": patches/@pierre__diffs@1.2.9.patch
  "@react-native-cookies/cookies@6.2.1": patches/@react-native-cookies__cookies@6.2.1.patch

# pnpm 10+ blocks dependency lifecycle scripts until they are allowed, and pnpm 9
# ran them. This is the set pnpm 11.24.0 reported as ignored for this tree,
# approved with `pnpm approve-builds --all`; without it native builds
# (better-sqlite3, node-pty, sharp, esbuild, workerd, @swc/core, @parcel/watcher,
# electron) are skipped instead of failing loudly.
allowBuilds:
  '@google/genai': true
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  dtrace-provider: true
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  node-pty: true
  protobufjs: true
  sharp: true
  workerd: true
